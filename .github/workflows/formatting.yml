name: Check formatting and linting

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Black and Ruff pre-commit hooks
        uses: pre-commit/action@v3.0.1
