site_name: morpho.py
site_url: https://tiagovla.github.io/morpho.py/
site_description: Plane-wave expansion for photonic crystal band structures

hooks:
  - docs/hooks.py

nav:
  - Home: index.md
  - Guides:
      - Numerical accuracy: numerics.md
      - Electromagnetic fields: fields.md
      - Brillouin-zone sampling: bulk.md
  - API reference: api.md
  - Examples: examples.md
  - Coverage: coverage.md
  - References: references.md

theme:
  name: material
  logo: assets/morpho-logo.svg
  favicon: assets/morpho-logo.svg
  palette:
    scheme: slate
    primary: blue
    accent: cyan
  features:
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            docstring_section_style: list
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
