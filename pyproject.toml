[project]
name = "morpho.py"
version = "0.2.4"
description = "PWE framework for photonic crystal analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{name = "Tiago Vilela", email = "tiagovla@gmail.com"}]
requires-python = ">=3.9,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=1.20.1,<3.0.0",
    "scipy>=1.6.2,<2.0.0",
    "matplotlib>=3.4.3,<4.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24.0",
]

[tool.poetry]
packages = [
    {include = "morpho", from = "."}
]

[dependency-groups]
dev = [
    "black==24.8.0",
    "pre-commit>=3.8.0,<4.0.0",
    "pytest>=5.2",
    "ruff==0.16.10",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24.0",
]

[tool.uv]
package = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

